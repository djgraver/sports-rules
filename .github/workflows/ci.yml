name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Downloads the real rulebooks and reports how well they split into rules.
  # Doesn't commit anything; the parsed files are uploaded as an artifact.
  ingest-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: npm ci
      - run: npm run ingest
        env:
          INGEST_DEBUG: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rules
          path: data/rules/
