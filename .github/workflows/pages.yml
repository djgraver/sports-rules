name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 22 1 * *" # monthly, after the data repo's rulebook check

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Secrets can't be used in step conditions directly, so expose whether they're set.
      HAS_DEPLOY_KEY: ${{ secrets.RULES_DATA_DEPLOY_KEY != '' }}
      HAS_TOKEN: ${{ secrets.RULES_DATA_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      # Parsed rulebooks live in the private djgraver/sports-rules-data repo. Access is via
      # either secret:
      #   RULES_DATA_DEPLOY_KEY  private half of a read-only deploy key added to that repo (preferred)
      #   RULES_DATA_TOKEN       fine-grained token with read-only Contents access to it
      - name: Check data repo credentials
        run: |
          if [ "$HAS_DEPLOY_KEY" != "true" ] && [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::Add RULES_DATA_DEPLOY_KEY (or RULES_DATA_TOKEN) as an Actions secret so the build can read djgraver/sports-rules-data."
            exit 1
          fi
      - name: Check out rulebook data (deploy key)
        if: env.HAS_DEPLOY_KEY == 'true'
        uses: actions/checkout@v4
        with:
          repository: djgraver/sports-rules-data
          ssh-key: ${{ secrets.RULES_DATA_DEPLOY_KEY }}
          path: data
          sparse-checkout: |
            rules
            scenarios
      - name: Check out rulebook data (token)
        if: env.HAS_DEPLOY_KEY != 'true'
        uses: actions/checkout@v4
        with:
          repository: djgraver/sports-rules-data
          token: ${{ secrets.RULES_DATA_TOKEN }}
          path: data
          sparse-checkout: |
            rules
            scenarios
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Project sites are served from https://<user>.github.io/<repo>/
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
