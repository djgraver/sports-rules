name: Refresh rulebooks

# Monthly check for new rulebook editions. Opens a pull request when anything changed.
on:
  schedule:
    - cron: "0 20 1 * *" # 1st of each month, early morning in Hobart
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: npm ci
      - run: npm run ingest
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: refresh-rulebooks
          title: Refresh rulebooks
          commit-message: Refresh parsed rulebooks
          body: The monthly rulebook check found changed documents. Review the rule counts in the workflow log before merging.
